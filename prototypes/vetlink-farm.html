<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Management — VetLink Africa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f8f4;--surface:#fff;--ink:#0f2a22;--mute:#52665e;--leaf:#1f6b4f;--leaf2:#d9ece3;--sun:#f2b33d;--red:#c8321f;--redbg:#fde9e5;--line:#d5ded8;--amber:#b86e00;--amberbg:#fff1d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1713;--surface:#12251e;--ink:#eaf3ee;--mute:#9db3a9;--leaf:#4fbf8f;--leaf2:#17352a;--line:#274035;--redbg:#3a1a15;--amberbg:#3a2a0c;--amber:#f2b33d}}
:root[data-theme="dark"]{--bg:#0b1713;--surface:#12251e;--ink:#eaf3ee;--mute:#9db3a9;--leaf:#4fbf8f;--leaf2:#17352a;--line:#274035;--redbg:#3a1a15;--amberbg:#3a2a0c;--amber:#f2b33d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif;line-height:1.15;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font:800 22px "Bricolage Grotesque",sans-serif}.logo span{color:var(--leaf)}
h1{font-size:clamp(26px,4vw,36px);margin:8px 0 16px}
h3{font-size:18px;margin:0 0 10px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:600 14px "Public Sans",sans-serif;cursor:pointer;background:var(--leaf);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 15px "Public Sans",sans-serif;color:var(--mute);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--leaf)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font:800 28px "Bricolage Grotesque",sans-serif}
.stat span{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.alert{border-left:6px solid var(--red);background:var(--redbg);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.alert.w{border-color:var(--amber);background:var(--amberbg)}
.alert b{display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
th{color:var(--mute);font-weight:600;border-top:0}
.tw{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--leaf2);color:var(--leaf)}
.pill.a{background:var(--amberbg);color:var(--amber)}.pill.r{background:var(--redbg);color:var(--red)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px;width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
svg text{fill:var(--mute);font:11px "Public Sans",sans-serif}
.bar{fill:var(--leaf)}.bar.low{fill:var(--red)}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">VetLink<span> Africa</span></div><span class="pill" id="farm">Lurambi farm</span></header>
<h1>Farm management</h1>
<div class="tabs" role="tablist">
 <button class="tab" role="tab" aria-selected="true" data-t="dairy">Dairy</button>
 <button class="tab" role="tab" aria-selected="false" data-t="poultry">Poultry</button>
 <button class="tab" role="tab" aria-selected="false" data-t="health">Health events</button>
</div>
<div id="view"></div>
</div>
<script>
const TODAY="2026-10-01";
const add=(s,n)=>{const d=new Date(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const fmt=s=>new Date(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const $=s=>document.querySelector(s);
let S={
 cows:[
  {tag:"KK-0231",name:"Bella",calved:"2026-03-10",status:"Lactating",ai:"2026-08-12",feed:14},
  {tag:"KK-0245",name:"Neema",calved:"2026-06-02",status:"Lactating",ai:null,feed:15},
  {tag:"KK-0198",name:"Zawadi",calved:"2025-11-20",status:"Dry",ai:"2026-02-05",feed:10},
  {tag:"KK-0260",name:"Pendo",calved:null,status:"Heifer",ai:null,feed:8}],
 milk:[],
 flock:{name:"Layers flock A",start:120,vacc:[["Newcastle disease","2026-09-25"],["Gumboro","2026-10-12"]]},
 eggs:[],
 events:[{date:"2026-09-28",kind:"Mortality",who:"Layers flock A",note:"2 birds lost, no other signs"},{date:"2026-09-10",kind:"Treatment",who:"Neema (KK-0245)",note:"Mastitis treated by Dr. Amina Wekesa"}]
};
// seed 14 days of logs
const m=[46,48,47,49,45,47,48,46,47,48,49,47,46,31];
S.milk=m.map((v,i)=>({date:add(TODAY,i-13),l:v}));
const e=[[96,0,15],[95,1,15],[94,0,15],[94,1,14],[93,0,15],[93,0,14],[93,0,15],[92,1,15],[91,0,14],[91,0,15],[91,0,15],[90,1,14],[89,0,15],[88,2,14]];
S.eggs=e.map((x,i)=>({date:add(TODAY,i-13),eggs:x[0],dead:x[1],feed:x[2]}));
try{const x=localStorage.getItem("vl-farm");if(x)S=JSON.parse(x)}catch(_){}
const save=()=>{try{localStorage.setItem("vl-farm",JSON.stringify(S))}catch(_){}};
const birds=()=>S.flock.start-S.eggs.reduce((n,x)=>n+x.dead,0)-S.events.filter(x=>x.kind==="Mortality"&&false).length;

function chart(data,key,label,unit){
  const w=520,h=170,p=28,mx=Math.max(...data.map(d=>d[key]))*1.1,bw=(w-p*2)/data.length;
  const avg=data.slice(0,-1).reduce((n,d)=>n+d[key],0)/(data.length-1);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${label} over the last 14 days"><line x1="${p}" x2="${w-p}" y1="${h-p}" y2="${h-p}" stroke="var(--line)"/>
  ${data.map((d,i)=>{const bh=(d[key]/mx)*(h-p*2);const low=d[key]<avg*.8&&i===data.length-1;return `<rect class="bar ${low?"low":""}" x="${p+i*bw+3}" y="${h-p-bh}" width="${bw-6}" height="${bh}" rx="3"><title>${fmt(d.date)}: ${d[key]} ${unit}</title></rect>${i%3===0||i===data.length-1?`<text x="${p+i*bw+bw/2}" y="${h-10}" text-anchor="middle">${fmt(d.date).replace(" Sep"," S").replace(" Oct"," O")}</text>`:""}`}).join("")}
  <text x="${p}" y="14">${label} (${unit}), last 14 days</text></svg>`;
}

function dairy(){
  const lact=S.cows.filter(c=>c.status==="Lactating"),last=S.milk.at(-1),prev=S.milk.slice(0,-1),avg=prev.reduce((n,x)=>n+x.l,0)/prev.length;
  const drop=Math.round((1-last.l/avg)*100);
  const preg=S.cows.filter(c=>c.ai&&diff(c.ai,TODAY)<283&&diff(c.ai,TODAY)>=0);
  $("#view").innerHTML=`<div class="stats"><div class="stat"><b>${S.cows.length}</b><span>Cows and heifers</span></div><div class="stat"><b>${lact.length}</b><span>In milk</span></div><div class="stat"><b>${last.l} L</b><span>Milk today</span></div><div class="stat"><b>${preg.length}</b><span>Served or pregnant</span></div></div>
  ${drop>=20?`<div class="alert"><b>Milk is down ${drop}% on the 13-day average</b>A sudden drop can come from illness, mastitis, heat stress or feed changes. Check udders and appetite, and contact a vet if cows look unwell. <a href="#" id="bk">Find a vet</a></div>`:""}
  <div class="grid"><div><div class="panel"><h3>Milk production</h3>${chart(S.milk,"l","Litres per day","L")}</div>
  <div class="panel"><h3>Herd register</h3><div class="tw"><table><tr><th>Tag</th><th>Name</th><th>Status</th><th>Days in milk</th><th>Calving</th></tr>
  ${S.cows.map(c=>{const dim=c.calved&&c.status==="Lactating"?diff(c.calved,TODAY):"—";const due=c.ai?add(c.ai,283):null;const left=due?diff(TODAY,due):null;
   return `<tr><td>${c.tag}</td><td>${c.name}</td><td><span class="pill ${c.status==="Dry"?"a":""}">${c.status}</span></td><td>${dim}</td><td>${due?(left>=0?`${fmt(due)} (${left} days)`:"Overdue, check with vet"):"Not served"}</td></tr>`}).join("")}</table></div>
  <p class="note">Expected calving is 283 days after insemination. Your vet confirms pregnancy with a check at about 60 days.</p></div></div>
  <div><div class="panel"><h3>Log today's milk</h3><label for="ml">Total litres</label><input id="ml" type="number" min="0" step="0.5" value="${last.l}"><button class="btn" id="mlb" style="margin-top:12px;width:100%">Save milk record</button></div>
  <div class="panel"><h3>Record insemination</h3><label for="cw">Cow</label><select id="cw">${S.cows.filter(c=>c.status!=="Dry"||true).map(c=>`<option value="${c.tag}">${c.name} (${c.tag})</option>`).join("")}</select><label for="ad">Date</label><input id="ad" type="date" value="${TODAY}"><button class="btn" id="aib" style="margin-top:12px;width:100%">Save insemination</button></div></div></div>`;
  $("#mlb").onclick=()=>{const v=+$("#ml").value;const t=S.milk.at(-1);t.l=v;save();dairy()};
  $("#aib").onclick=()=>{const c=S.cows.find(x=>x.tag===$("#cw").value);c.ai=$("#ad").value;S.events.unshift({date:$("#ad").value,kind:"Breeding",who:`${c.name} (${c.tag})`,note:"Insemination recorded"});save();dairy()};
  const b=$("#bk");if(b)b.onclick=ev=>{ev.preventDefault();alert("This opens the vet finder and booking page.")};
}
function poultry(){
  const f=S.flock,last=S.eggs.at(-1),dead=S.eggs.reduce((n,x)=>n+x.dead,0)+0,live=f.start-dead-2,rate=Math.round(last.eggs/live*100);
  const wk=S.eggs.slice(-7).reduce((n,x)=>n+x.dead,0),wkRate=(wk/live*100).toFixed(1);
  $("#view").innerHTML=`<div class="stats"><div class="stat"><b>${live}</b><span>Live birds</span></div><div class="stat"><b>${last.eggs}</b><span>Eggs today</span></div><div class="stat"><b>${rate}%</b><span>Laying rate</span></div><div class="stat"><b>${wk}</b><span>Deaths this week (${wkRate}%)</span></div></div>
  ${wk>=3?`<div class="alert"><b>${wk} deaths in 7 days</b>Several losses in a week can signal disease. Isolate any sick birds, keep dead birds for a vet to examine, and call a vet or animal health officer. Do not sell or move birds until advised.</div>`:""}
  <div class="grid"><div><div class="panel"><h3>${f.name}: eggs per day</h3>${chart(S.eggs,"eggs","Eggs per day","eggs")}</div>
  <div class="panel"><h3>Vaccination schedule</h3><div class="tw"><table><tr><th>Vaccine</th><th>Date</th><th>Status</th></tr>${f.vacc.map(v=>{const n=diff(TODAY,v[1]);return `<tr><td>${v[0]}</td><td>${fmt(v[1])}</td><td><span class="pill ${n<0?"r":n<=14?"a":""}">${n<0?"Overdue "+(-n)+" days":"In "+n+" days"}</span></td></tr>`}).join("")}</table></div></div></div>
  <div><div class="panel"><h3>Daily record</h3><div class="f2"><div><label for="eg">Eggs</label><input id="eg" type="number" min="0" value="${last.eggs}"></div><div><label for="dd">Deaths</label><input id="dd" type="number" min="0" value="0"></div></div><label for="fd">Feed used (kg)</label><input id="fd" type="number" min="0" step="0.5" value="${last.feed}"><button class="btn" id="eb" style="margin-top:12px;width:100%">Save today's record</button><p class="note">Feed per bird today: ${(last.feed*1000/live).toFixed(0)} g</p></div></div></div>`;
  $("#eb").onclick=()=>{const d=+$("#dd").value;S.eggs.at(-1).eggs=+$("#eg").value;S.eggs.at(-1).dead=d;S.eggs.at(-1).feed=+$("#fd").value;
    if(d>0)S.events.unshift({date:TODAY,kind:"Mortality",who:f.name,note:d+" birds lost"});save();poultry()};
}
function health(){
  $("#view").innerHTML=`<div class="grid"><div class="panel"><h3>Health and breeding events</h3>${S.events.length?`<div class="tw"><table><tr><th>Date</th><th>Type</th><th>Animal or flock</th><th>Notes</th></tr>${S.events.map(x=>`<tr><td>${fmt(x.date)}</td><td><span class="pill ${x.kind==="Disease"||x.kind==="Mortality"?"r":""}">${x.kind}</span></td><td>${x.who}</td><td>${x.note}</td></tr>`).join("")}</table></div>`:"<p>No events yet.</p>"}</div>
  <div class="panel"><h3>Record an event</h3><label for="ek">Type</label><select id="ek"><option>Disease</option><option>Treatment</option><option>Mortality</option><option>Breeding</option><option>Calving</option></select><label for="ew">Animal or flock</label><input id="ew" placeholder="e.g. Neema (KK-0245)"><label for="en">Notes</label><textarea id="en" rows="3" placeholder="Signs, number affected, what you did"></textarea><button class="btn" id="eb2" style="margin-top:12px;width:100%">Save event</button>
  <p class="note">Report suspected notifiable diseases such as foot and mouth, anthrax or avian influenza to your county veterinary office straight away.</p></div></div>`;
  $("#eb2").onclick=()=>{if(!$("#ew").value.trim())return;S.events.unshift({date:TODAY,kind:$("#ek").value,who:$("#ew").value,note:$("#en").value});save();health()};
}
const V={dairy,poultry,health};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));V[b.dataset.t]()});
dairy();
</script>
</body>
</html>
