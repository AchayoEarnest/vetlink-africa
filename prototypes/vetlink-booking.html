<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a Vet — VetLink Africa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f8f4;--surface:#fff;--ink:#0f2a22;--mute:#52665e;--leaf:#1f6b4f;--leaf2:#d9ece3;--sun:#f2b33d;--red:#c8321f;--redbg:#fde9e5;--line:#d5ded8;--amber:#b86e00;--amberbg:#fff1d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1713;--surface:#12251e;--ink:#eaf3ee;--mute:#9db3a9;--leaf:#4fbf8f;--leaf2:#17352a;--line:#274035;--redbg:#3a1a15;--amberbg:#3a2a0c;--amber:#f2b33d}}
:root[data-theme="dark"]{--bg:#0b1713;--surface:#12251e;--ink:#eaf3ee;--mute:#9db3a9;--leaf:#4fbf8f;--leaf2:#17352a;--line:#274035;--redbg:#3a1a15;--amberbg:#3a2a0c;--amber:#f2b33d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif;line-height:1.15;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font:800 22px "Bricolage Grotesque",sans-serif}.logo span{color:var(--leaf)}
h1{font-size:clamp(26px,4vw,36px);margin:8px 0 16px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:600 14px "Public Sans",sans-serif;cursor:pointer;background:var(--leaf);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sos{background:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 15px "Public Sans",sans-serif;color:var(--mute);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--leaf)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.vet{display:flex;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;width:100%;text-align:left;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.vet[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf2)}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:var(--leaf2);display:grid;place-items:center;font-weight:700;color:var(--leaf)}
.vet[aria-pressed="true"] .av{background:var(--surface)}
.vet small{display:block;color:var(--mute)}
.ver{font-size:12px;font-weight:700;color:var(--leaf);background:var(--leaf2);border-radius:6px;padding:2px 7px}
.vet[aria-pressed="true"] .ver{background:var(--surface)}
.profile dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:12px 0}
dt{font-size:13px;color:var(--mute)}dd{margin:0;font-weight:600}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px "Public Sans",sans-serif;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.opt.u[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--leaf2);color:var(--leaf)}
.s-Requested{background:var(--amberbg);color:var(--amber)}
.s-Cancelled{background:var(--redbg);color:var(--red)}
.s-Completed{background:var(--line);color:var(--mute)}
.appt{border-top:1px solid var(--line);padding:14px 0}
.appt:first-of-type{border-top:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.flow{display:flex;gap:4px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.flow b{color:var(--leaf)}
.resp{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--mute);margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:9}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">VetLink<span> Africa</span></div><button class="btn sos" id="sos">Emergency</button></header>
<h1>Get a vet to your animal</h1>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-t="book">Book a vet</button>
  <button class="tab" role="tab" aria-selected="false" data-t="req">Post a request</button>
  <button class="tab" role="tab" aria-selected="false" data-t="mine">My appointments <span class="pill" id="cnt">0</span></button>
</div>
<div id="book"></div><div id="req" hidden></div><div id="mine" hidden></div>
</div>
<script>
const VETS=[
 {id:1,n:"Dr. John Doe",ini:"JD",role:"Small animal specialist",d:2.4,sp:["Dogs","Cats","Rabbits"],svc:["Physical","Home visit","Online"],fee:{Physical:1500,"Home visit":3000,Online:800},yrs:9,clinic:"Kakamega Pet Clinic",lang:"English, Kiswahili"},
 {id:2,n:"Dr. Amina Wekesa",ini:"AW",role:"Mixed and dairy practice",d:7.8,sp:["Cattle","Goats","Sheep","Pigs"],svc:["Farm visit","Online","Emergency"],fee:{"Farm visit":4000,Online:1000,Emergency:6000},yrs:12,clinic:"Mobile practice",lang:"English, Kiswahili, Luhya"},
 {id:3,n:"Dr. Peter Otieno",ini:"PO",role:"Poultry health officer",d:12.5,sp:["Poultry","Rabbits"],svc:["Farm visit","Online"],fee:{"Farm visit":3000,Online:700},yrs:6,clinic:"Mumias Livestock Clinic",lang:"English, Kiswahili, Dholuo"}
];
const ANIMALS=["Max (dog)","Bella (cow)","Layers flock A (poultry)","Other animal"];
const FLOW=["Requested","Confirmed","Rescheduled","In Progress","Completed"];
let vet=VETS[0],svc="Physical",urg="Routine",tab="book";
let appts=[{id:1,vet:"Dr. John Doe",animal:"Max (dog)",svc:"Physical",date:"2026-10-15",time:"10:00",status:"Confirmed",fee:1500,urg:"Routine"}];
const $=s=>document.querySelector(s),fmt=s=>new Date(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const kes=n=>"KES "+n.toLocaleString();
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

function drawBook(){
  if(!vet.svc.includes(svc)) svc=vet.svc[0];
  $("#book").innerHTML=`<div class="grid"><div>
   ${VETS.map(v=>`<button class="vet" data-v="${v.id}" aria-pressed="${v.id===vet.id}"><span class="av">${v.ini}</span><span style="flex:1"><b>${v.n}</b> <span class="ver">Verified Veterinary Professional</span><small>${v.role}. ${v.d} km away</small><small>${v.sp.join(", ")}</small></span></button>`).join("")}
   <p class="note">Verified status appears only after registration checks. Sample vets shown here.</p></div>
   <div class="panel profile"><h3>${vet.n}</h3><small style="color:var(--mute)">${vet.role}, ${vet.clinic}</small>
    <dl><div><dt>Experience</dt><dd>${vet.yrs} years</dd></div><div><dt>Languages</dt><dd>${vet.lang}</dd></div><div><dt>Species</dt><dd>${vet.sp.join(", ")}</dd></div><div><dt>Fee for this service</dt><dd>${kes(vet.fee[svc])}</dd></div></dl>
    <label>Service</label><div class="opts">${vet.svc.map(s=>`<button class="opt" data-s="${s}" aria-pressed="${s===svc}">${s}</button>`).join("")}</div>
    <label for="an">Animal</label><select id="an">${ANIMALS.map(a=>`<option>${a}</option>`).join("")}</select>
    <div class="grid" style="gap:10px"><div><label for="dt">Date</label><input id="dt" type="date" min="2026-10-01" value="2026-10-03"></div><div><label for="tm">Time</label><select id="tm"><option>09:00</option><option>10:00</option><option>11:00</option><option>14:00</option><option>16:00</option></select></div></div>
    <label>Urgency</label><div class="opts">${["Routine","Soon","Urgent"].map(u=>`<button class="opt ${u==="Urgent"?"u":""}" data-u="${u}" aria-pressed="${u===urg}">${u}</button>`).join("")}</div>
    <label for="nt">What is the concern?</label><textarea id="nt" rows="3" placeholder="Describe signs, how long, and anything you have tried"></textarea>
    <p class="note" id="warn" ${urg==="Urgent"?"":"hidden"} style="color:var(--red)">For breathing trouble, heavy bleeding, seizures, poisoning or a difficult birth, use the Emergency button now instead of waiting for a booking.</p>
    <button class="btn" id="go" style="width:100%;margin-top:14px">Request ${svc.toLowerCase()} · ${kes(vet.fee[svc])}</button>
    <p class="note">Payment (M-Pesa or card) is collected after the vet confirms.</p></div></div>`;
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{vet=VETS.find(v=>v.id==b.dataset.v);drawBook()});
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{svc=b.dataset.s;drawBook()});
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{urg=b.dataset.u;drawBook()});
  $("#go").onclick=()=>{
    appts.unshift({id:Date.now(),vet:vet.n,animal:$("#an").value,svc,date:$("#dt").value,time:$("#tm").value,status:"Requested",fee:vet.fee[svc],urg,note:$("#nt").value});
    toast("Request sent to "+vet.n);go("mine")};
}
let reqs=[];
function drawReq(){
  $("#req").innerHTML=`<div class="grid"><div class="panel"><h3>Ask nearby vets</h3><p class="note" style="margin-top:6px">Verified vets within your radius see your request and can respond. You choose who to book.</p>
   <label for="ra">Animal</label><select id="ra">${ANIMALS.map(a=>`<option>${a}</option>`).join("")}</select>
   <label for="rl">Location</label><input id="rl" value="Kakamega">
   <label for="rs">Preferred service</label><select id="rs"><option>Farm visit</option><option>Home visit</option><option>Physical</option><option>Online</option></select>
   <label for="ru">Urgency</label><select id="ru"><option>Routine</option><option>Soon</option><option selected>High</option></select>
   <label for="rp">Problem</label><textarea id="rp" rows="3">The cow has reduced appetite and appears weak.</textarea>
   <button class="btn" id="rgo" style="width:100%;margin-top:14px">Send request</button></div>
   <div id="rlist"></div></div>`;
  $("#rgo").onclick=()=>{
    const r={id:Date.now(),animal:$("#ra").value,loc:$("#rl").value,p:$("#rp").value,u:$("#ru").value,resp:[],chosen:null};
    reqs.unshift(r);drawReqList();
    // simulated vet responses arriving
    VETS.slice(0,2).forEach((v,i)=>setTimeout(()=>{r.resp.push({v,eta:i?"Tomorrow, 9 am":"Today, within 2 hours",fee:v.fee[Object.keys(v.fee)[0]]});drawReqList()},1200*(i+1)));
    toast("Request sent to verified vets nearby")};
  drawReqList();
}
function drawReqList(){
  const el=$("#rlist");if(!el)return;
  el.innerHTML=reqs.length?reqs.map(r=>`<div class="panel" style="margin-bottom:12px"><b>${r.animal}</b> in ${r.loc} <span class="pill">${r.u} urgency</span><p style="margin:6px 0">${r.p}</p>
   ${r.chosen?`<p><span class="pill">Booked</span> with ${r.chosen}. See My appointments.</p>`:r.resp.length?r.resp.map((x,i)=>`<div class="resp"><span><b>${x.v.n}</b><br><small style="color:var(--mute)">${x.eta}. From ${kes(x.fee)}</small></span><button class="btn" data-r="${r.id}:${i}">Choose</button></div>`).join(""):"<small style='color:var(--mute)'>Waiting for responses…</small>"}</div>`).join(""):`<div class="panel"><p style="margin:0">No requests yet. Describe the problem and nearby vets will respond here.</p></div>`;
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const [id,i]=b.dataset.r.split(":"),r=reqs.find(x=>x.id==id),x=r.resp[+i];
    r.chosen=x.v.n;appts.unshift({id:Date.now(),vet:x.v.n,animal:r.animal,svc:"Farm visit",date:"2026-10-02",time:"09:00",status:"Requested",fee:x.fee,urg:r.u});
    drawReqList();upd();toast("Booked with "+x.v.n)});
}
function drawMine(){
  $("#mine").innerHTML=`<div class="panel">${appts.length?appts.map(a=>`<div class="appt"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${a.vet}</b><span class="pill s-${a.status.replace(" ","")}">${a.status}</span></div>
   <div>${a.animal}. ${a.svc}. ${fmt(a.date)}, ${a.time}. ${kes(a.fee)}</div>
   <div class="flow">${FLOW.map(f=>f===a.status?`<b>${f}</b>`:f).join(" › ")}</div>
   <div class="acts">${a.status==="Requested"?`<button class="btn alt" data-a="confirm:${a.id}">Simulate vet confirming</button>`:""}${a.status==="Confirmed"||a.status==="Rescheduled"?`<button class="btn alt" data-a="resched:${a.id}">Reschedule</button><button class="btn alt" data-a="start:${a.id}">Start visit</button>`:""}${a.status==="In Progress"?`<button class="btn" data-a="done:${a.id}">Mark completed</button>`:""}${["Requested","Confirmed","Rescheduled"].includes(a.status)?`<button class="btn alt" data-a="cancel:${a.id}">Cancel</button>`:""}</div></div>`).join(""):"<p>No appointments yet.</p>"}
   <p class="note">Reminders go out by SMS, push and email 24 hours and 1 hour before a visit (needs the notification service).</p></div>`;
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const [k,id]=b.dataset.a.split(":"),a=appts.find(x=>x.id==id);
    if(k==="confirm"){a.status="Confirmed";toast("Confirmed. Reminder scheduled.")}
    if(k==="resched"){a.date="2026-10-20";a.status="Rescheduled";toast("Moved to 20 Oct")}
    if(k==="start")a.status="In Progress";
    if(k==="done"){a.status="Completed";toast("Completed. The record is added to the animal's timeline.")}
    if(k==="cancel")a.status="Cancelled";
    upd();drawMine()});
}
function upd(){$("#cnt").textContent=appts.filter(a=>!["Completed","Cancelled"].includes(a.status)).length}
function go(t){tab=t;["book","req","mine"].forEach(x=>$("#"+x).hidden=x!==t);
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  if(t==="book")drawBook();if(t==="req")drawReq();if(t==="mine")drawMine();upd()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.t));
$("#sos").onclick=()=>alert("Emergency: call a vet now. Keep the animal calm and warm, and do not give human medicine.");
go("book");
</script>
</body>
</html>
