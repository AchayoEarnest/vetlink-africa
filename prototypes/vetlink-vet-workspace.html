<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vet Workspace — VetLink Africa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f8f4;--surface:#fff;--ink:#0f2a22;--mute:#52665e;--leaf:#1f6b4f;--leaf2:#d9ece3;--sun:#f2b33d;--red:#c8321f;--redbg:#fde9e5;--line:#d5ded8;--amber:#b86e00;--amberbg:#fff1d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1713;--surface:#12251e;--ink:#eaf3ee;--mute:#9db3a9;--leaf:#4fbf8f;--leaf2:#17352a;--line:#274035;--redbg:#3a1a15;--amberbg:#3a2a0c;--amber:#f2b33d}}
:root[data-theme="dark"]{--bg:#0b1713;--surface:#12251e;--ink:#eaf3ee;--mute:#9db3a9;--leaf:#4fbf8f;--leaf2:#17352a;--line:#274035;--redbg:#3a1a15;--amberbg:#3a2a0c;--amber:#f2b33d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif;line-height:1.15;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;gap:10px;flex-wrap:wrap}
.logo{font:800 22px "Bricolage Grotesque",sans-serif}.logo span{color:var(--leaf)}
h1{font-size:clamp(26px,4vw,36px);margin:8px 0 16px}
h3{font-size:18px;margin-bottom:10px}
.btn{border:0;border-radius:10px;padding:9px 14px;font:600 14px "Public Sans",sans-serif;cursor:pointer;background:var(--leaf);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.r{background:var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 15px "Public Sans",sans-serif;color:var(--mute);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--leaf)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font:800 28px "Bricolage Grotesque",sans-serif}
.stat span{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-of-type{border-top:0}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--leaf2);color:var(--leaf)}
.pill.a{background:var(--amberbg);color:var(--amber)}.pill.r{background:var(--redbg);color:var(--red)}.pill.g{background:var(--line);color:var(--mute)}
small,.mute{color:var(--mute)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px;width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--leaf2)}
.tl li{position:relative;padding:0 0 14px 12px}
.tl li:before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--leaf)}
.by{font-size:12px;font-weight:600;color:var(--leaf)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sw input{width:auto;transform:scale(1.3)}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:9}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">VetLink<span> Africa</span> <small style="font:500 14px 'Public Sans'">Vet workspace</small></div><div class="row" style="gap:10px"><span class="pill" id="vstat">Verified Veterinary Professional</span><label style="margin:0;display:flex;gap:6px;align-items:center"><input id="avail" type="checkbox" checked style="width:auto"> Accepting requests</label></div></header>
<h1>Dr. Amina Wekesa</h1>
<div class="tabs" role="tablist">
 <button class="tab" role="tab" aria-selected="true" data-t="today">Today</button>
 <button class="tab" role="tab" aria-selected="false" data-t="req">Nearby requests <span class="pill a" id="rc"></span></button>
 <button class="tab" role="tab" aria-selected="false" data-t="rec">Patient records</button>
 <button class="tab" role="tab" aria-selected="false" data-t="prof">Profile</button>
</div>
<div id="view"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const kes=n=>"KES "+n.toLocaleString();
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)};
let appts=[
 {id:1,time:"09:00",owner:"Wanjiru K.",animal:"Bella (cow)",svc:"Farm visit",loc:"Lurambi, 7.8 km",status:"Confirmed",urg:"Routine",note:"Pregnancy check, served 12 Aug."},
 {id:2,time:"11:30",owner:"James M.",animal:"Neema (cow)",svc:"Farm visit",loc:"Shinyalu, 14 km",status:"Requested",urg:"Soon",note:"Swollen udder on one quarter, milk looks thick."},
 {id:3,time:"14:00",owner:"Achieng O.",animal:"Goat herd (12)",svc:"Online",loc:"Online",status:"Requested",urg:"Routine",note:"Deworming plan for the dry season."}
];
let reqs=[
 {id:11,owner:"Peter S.",animal:"Dairy cow",loc:"Kakamega, 6 km",u:"High",p:"Reduced appetite, appears weak since yesterday.",resp:false},
 {id:12,owner:"Mary N.",animal:"Calf",loc:"Malava, 18 km",u:"Urgent",p:"Calf has diarrhoea and is not suckling.",resp:false},
 {id:13,owner:"Joseph L.",animal:"Sheep flock (30)",loc:"Butere, 22 km",u:"Routine",p:"Annual vaccination for the flock.",resp:false}
];
let pats={
 "Bella (cow)":[{t:"Breeding",title:"Artificial insemination",date:"12 Aug 2026",by:"Dr. Amina Wekesa, verified",note:"Semen: Friesian line. Pregnancy check due in 60 days."}],
 "Neema (cow)":[{t:"Treatment",title:"Mastitis treated",date:"10 Sep 2026",by:"Dr. Amina Wekesa, verified",note:"Follow-up in 3 weeks."}]
};
let cur="Bella (cow)";
function upd(){const n=reqs.filter(r=>!r.resp).length;$("#rc").textContent=n||"";$("#rc").hidden=!n}

function today(){
  const pend=appts.filter(a=>a.status==="Requested").length,done=appts.filter(a=>a.status==="Completed").length;
  $("#view").innerHTML=`<div class="stats"><div class="stat"><b>${appts.length}</b><span>Visits today</span></div><div class="stat"><b>${pend}</b><span>Waiting for you to accept</span></div><div class="stat"><b>${done}</b><span>Completed</span></div><div class="stat"><b>${kes(appts.filter(a=>a.status==="Completed").length*4000)}</b><span>Earned today (est.)</span></div></div>
  <div class="panel"><h3>Today's schedule</h3>${appts.map(a=>`<div class="item"><div class="row"><span><b>${a.time}</b> ${a.animal} <small>(${a.owner})</small></span><span><span class="pill ${a.urg==="Soon"?"a":""}">${a.urg}</span> <span class="pill ${a.status==="Requested"?"a":a.status==="Declined"||a.status==="Cancelled"?"r":a.status==="Completed"?"g":""}">${a.status}</span></span></div>
  <div class="mute">${a.svc}. ${a.loc}</div><div>${a.note}</div>
  <div class="acts">${a.status==="Requested"?`<button class="btn" data-a="ok:${a.id}">Accept</button><button class="btn alt" data-a="no:${a.id}">Decline</button>`:""}${a.status==="Confirmed"?`<button class="btn" data-a="go:${a.id}">Start visit</button>`:""}${a.status==="In Progress"?`<button class="btn" data-a="done:${a.id}">Complete and add record</button>`:""}${a.status!=="Requested"&&a.status!=="Declined"?`<button class="btn alt" data-a="rec:${a.id}">Open records</button>`:""}</div></div>`).join("")}</div>`;
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const [k,id]=b.dataset.a.split(":"),a=appts.find(x=>x.id==id);
    if(k==="ok"){a.status="Confirmed";toast("Accepted. Owner notified and reminder set.")}
    if(k==="no"){a.status="Declined";toast("Declined. Owner will be offered other vets.")}
    if(k==="go")a.status="In Progress";
    if(k==="done"){a.status="Completed";cur=a.animal;go("rec");toast("Visit complete. Add the clinical record.");return}
    if(k==="rec"){cur=a.animal;go("rec");return}
    today()});
}
function reqView(){
  $("#view").innerHTML=`<div class="panel"><h3>Requests from nearby owners</h3>${!$("#avail").checked?'<p class="mute">You are not accepting requests. Turn it on at the top of the page to respond.</p>':""}${reqs.map(r=>`<div class="item"><div class="row"><b>${r.animal} <small>(${r.owner}, ${r.loc})</small></b><span class="pill ${r.u==="Urgent"?"r":r.u==="High"?"a":""}">${r.u}</span></div><div>${r.p}</div>
  ${r.resp?`<p><span class="pill">Response sent</span> Waiting for the owner to choose.</p>`:`<div class="f2" style="margin-top:8px"><div><label for="e${r.id}">When can you come?</label><select id="e${r.id}"><option>Within 2 hours</option><option>Today</option><option>Tomorrow morning</option></select></div><div><label for="f${r.id}">Visit fee (KES)</label><input id="f${r.id}" type="number" value="4000"></div></div><div class="acts"><button class="btn" data-r="${r.id}" ${$("#avail").checked?"":"disabled"}>Send response</button><button class="btn alt" data-s="${r.id}">Skip</button></div>`}</div>`).join("")||"<p>No open requests nearby.</p>"}</div>`;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=reqs.find(x=>x.id==b.dataset.r);r.resp=true;toast("Response sent to "+r.owner);upd();reqView()});
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{reqs=reqs.filter(x=>x.id!=b.dataset.s);upd();reqView()});
}
function rec(){
  const names=Object.keys(pats);appts.forEach(a=>{if(!names.includes(a.animal)){pats[a.animal]=[];names.push(a.animal)}});
  $("#view").innerHTML=`<div class="grid"><div class="panel"><div class="row"><h3>${cur}</h3><select id="ps" style="width:auto" aria-label="Patient">${Object.keys(pats).map(n=>`<option ${n===cur?"selected":""}>${n}</option>`).join("")}</select></div>
  <p class="note" style="margin:0 0 12px">You see only animals whose owners booked you or shared the profile with you.</p>
  ${pats[cur].length?`<ul class="tl">${pats[cur].map(e=>`<li><b>${e.title}</b> <span class="pill">${e.t}</span><br><small>${e.date}</small><br><span class="by">${e.by}</span><br>${e.note}</li>`).join("")}</ul>`:"<p>No records yet.</p>"}</div>
  <div class="panel"><h3>Add professional record</h3><label for="rt">Type</label><select id="rt"><option>Consultation</option><option>Diagnosis</option><option>Treatment</option><option>Vaccination</option><option>Lab test</option><option>Surgery</option><option>Breeding</option><option>Follow-up</option></select>
  <label for="rn">Title</label><input id="rn" placeholder="e.g. Clinical exam and treatment"><label for="rd">Findings, treatment and advice</label><textarea id="rd" rows="4"></textarea>
  <label for="rf">Follow-up in (days, optional)</label><input id="rf" type="number" min="0">
  <button class="btn" id="rs" style="width:100%;margin-top:12px">Sign and save record</button><p class="note">Records you add show your name and the verified badge. The owner is notified, and any follow-up becomes a reminder.</p></div></div>`;
  $("#ps").onchange=e=>{cur=e.target.value;rec()};
  $("#rs").onclick=()=>{if(!$("#rn").value.trim())return;const f=$("#rf").value;
    pats[cur].unshift({t:$("#rt").value,title:$("#rn").value,date:"1 Oct 2026",by:"Dr. Amina Wekesa, verified",note:$("#rd").value+(f?` Follow-up in ${f} days.`:"")});
    toast("Record saved to "+cur+"'s timeline");rec()};
}
function prof(){
  $("#view").innerHTML=`<div class="grid"><div class="panel"><h3>Professional profile</h3><div class="f2"><div><label for="p1">Clinic or practice</label><input id="p1" value="Mobile practice"></div><div><label for="p2">Specialty</label><input id="p2" value="Mixed and dairy practice"></div></div>
  <label for="p3">Species treated</label><input id="p3" value="Cattle, Goats, Sheep, Pigs"><label for="p4">Languages</label><input id="p4" value="English, Kiswahili, Luhya">
  <label>Services and fees (KES)</label><div class="f2"><input aria-label="Farm visit fee" value="Farm visit: 4000"><input aria-label="Online fee" value="Online: 1000"><input aria-label="Emergency fee" value="Emergency: 6000"><input aria-label="Service radius" value="Service radius: 30 km"></div>
  <button class="btn" id="psv" style="margin-top:12px">Save profile</button></div>
  <div class="panel"><h3>Verification</h3><div class="sw"><span>Registration with the Kenya Veterinary Board</span><span class="pill">Checked</span></div><div class="sw"><span>Practising licence</span><span class="pill">Checked</span></div><div class="sw"><span>Identity</span><span class="pill">Checked</span></div>
  <p class="note">The badge appears only after an admin reviews your documents. Licence expiry removes it automatically.</p>
  <h3 style="margin-top:16px">Availability</h3><div class="sw"><span>Home and farm visits</span><input type="checkbox" checked aria-label="Visits"></div><div class="sw"><span>Emergency calls (24 hours)</span><input type="checkbox" checked aria-label="Emergency"></div><div class="sw"><span>Online consultations</span><input type="checkbox" checked aria-label="Online"></div></div></div>`;
  $("#psv").onclick=()=>toast("Profile saved");
}
const V={today,req:reqView,rec,prof};
function go(t){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));V[t]();upd()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.t));
$("#avail").onchange=()=>{if(document.querySelector('.tab[data-t="req"]').getAttribute("aria-selected")==="true")reqView()};
go("today");
</script>
</body>
</html>
