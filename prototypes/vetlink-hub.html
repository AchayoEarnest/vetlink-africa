<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community, Shop, Alerts — VetLink Africa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f8f4;--surface:#fff;--ink:#0f2a22;--mute:#52665e;--leaf:#1f6b4f;--leaf2:#d9ece3;--sun:#f2b33d;--red:#c8321f;--redbg:#fde9e5;--line:#d5ded8;--amber:#b86e00;--amberbg:#fff1d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1713;--surface:#12251e;--ink:#eaf3ee;--mute:#9db3a9;--leaf:#4fbf8f;--leaf2:#17352a;--line:#274035;--redbg:#3a1a15;--amberbg:#3a2a0c;--amber:#f2b33d}}
:root[data-theme="dark"]{--bg:#0b1713;--surface:#12251e;--ink:#eaf3ee;--mute:#9db3a9;--leaf:#4fbf8f;--leaf2:#17352a;--line:#274035;--redbg:#3a1a15;--amberbg:#3a2a0c;--amber:#f2b33d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif;line-height:1.15;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;gap:10px;flex-wrap:wrap}
.logo{font:800 22px "Bricolage Grotesque",sans-serif}.logo span{color:var(--leaf)}
h3{font-size:18px;margin-bottom:8px}
.btn{border:0;border-radius:10px;padding:9px 14px;font:600 14px "Public Sans",sans-serif;cursor:pointer;background:var(--leaf);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.r{background:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:6px 0 20px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 15px "Public Sans",sans-serif;color:var(--mute);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--leaf)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.prod{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.em{font-size:36px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--leaf2);color:var(--leaf)}
.pill.a{background:var(--amberbg);color:var(--amber)}.pill.r{background:var(--redbg);color:var(--red)}
.mute{color:var(--mute);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px;width:100%}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;font:500 14px "Public Sans",sans-serif;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.post{border-top:1px solid var(--line);padding:14px 0}
.post:first-of-type{border-top:0}
.warn{border-left:5px solid var(--red);background:var(--redbg);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.vetans{border-left:5px solid var(--leaf);background:var(--leaf2);padding:8px 12px;border-radius:8px;margin-top:8px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.cart-line{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sw input{width:auto;transform:scale(1.3)}
.n{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.n:first-of-type{border-top:0}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:9}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">VetLink<span> Africa</span></div><div id="who"></div></header>
<div class="tabs" role="tablist" id="tabs">
 <button class="tab" role="tab" aria-selected="true" data-t="com">Community</button>
 <button class="tab" role="tab" aria-selected="false" data-t="shop">Shop</button>
 <button class="tab" role="tab" aria-selected="false" data-t="nt">Alerts <span class="badge" id="nb"></span></button>
 <button class="tab" role="tab" aria-selected="false" data-t="acc">Account</button>
</div>
<div id="view"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const kes=n=>"KES "+n.toLocaleString();
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)};
const EMER=/(not breathing|can'?t breathe|poison|seizure|collaps|bleeding|bloat|dying|can'?t stand)/i;
const BAD=/(sell\s+(me\s+)?(antibiotic|drug|medicine)|whatsapp me|\bbuy now\b)/i;
let user=null;

// ---------- Community
let posts=[
 {id:1,cat:"Poultry",by:"Achieng O.",t:"My layers' egg production dropped this month. What feed mix works for you?",likes:6,rep:false,vet:null,ans:["I switched to a layers mash with grit and saw eggs recover in two weeks. Fresh water helps a lot."]},
 {id:2,cat:"Dogs",by:"Kevin M.",t:"Success story: my rescued puppy finished his vaccinations and is healthy!",likes:21,rep:false,vet:null,ans:[]},
 {id:3,cat:"Livestock",by:"James M.",t:"My goat keeps coughing and has a runny nose. Should I give antibiotics from the shop?",likes:2,rep:false,vet:{n:"Dr. Amina Wekesa",t:"Please do not give antibiotics without a vet exam. Coughing in goats can have several causes, and the wrong drug can do harm. Book a vet or farm visit, and keep the goat apart from the herd."},ans:[]}
];
let ccat="All",cform="";
function community(){
  const cats=["All","Dogs","Cats","Livestock","Poultry","Farming","Animal welfare","Nutrition"];
  const list=posts.filter(p=>!p.rep&&(ccat==="All"||p.cat===ccat));
  $("#view").innerHTML=`<div class="grid"><div><div class="opts" role="group" aria-label="Category">${cats.map(c=>`<button class="opt" data-c="${c}" aria-pressed="${c===ccat}">${c}</button>`).join("")}</div>
  <div class="panel">${list.map(p=>`<div class="post"><div class="row"><b>${p.by}</b><span class="pill">${p.cat}</span></div><p style="margin:6px 0">${p.t}</p>
   ${EMER.test(p.t)?`<div class="warn"><b>This sounds urgent.</b> Please contact a vet now instead of waiting for replies.</div>`:""}
   ${p.ans.map(a=>`<div class="mute" style="margin:4px 0 0 12px">↳ ${a}</div>`).join("")}
   ${p.vet?`<div class="vetans"><b>${p.vet.n}</b> <span class="pill">Verified Veterinary Professional</span><br>${p.vet.t}</div>`:""}
   <div class="row" style="margin-top:8px"><span><button class="btn alt" data-l="${p.id}">♥ ${p.likes}</button> <button class="btn alt" data-a="${p.id}">Reply</button></span><button class="btn alt" data-r="${p.id}">Report</button></div></div>`).join("")||"<p>No posts yet. Be the first to share a tip or question.</p>"}</div></div>
  <div><div class="panel"><h3>Share with the community</h3><label for="pc">Category</label><select id="pc">${cats.slice(1).map(c=>`<option>${c}</option>`).join("")}</select><label for="pt">Your post</label><textarea id="pt" rows="4" placeholder="Ask a question, share a tip or a success story">${cform}</textarea><button class="btn" id="ps" style="width:100%;margin-top:10px">Post</button>
  <p class="note">The community is for sharing experience. It does not replace a vet. Posts asking for or selling medicines are held for moderator review.</p></div></div></div>`;
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ccat=b.dataset.c;community()});
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{posts.find(p=>p.id==b.dataset.l).likes++;community()});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{if(!need())return;const t=prompt("Your reply");if(t){posts.find(p=>p.id==b.dataset.a).ans.push(t);community()}});
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{posts.find(p=>p.id==b.dataset.r).rep=true;toast("Reported. A moderator will review it.");community()});
  $("#ps").onclick=()=>{if(!need())return;const t=$("#pt").value.trim();if(!t)return;
    if(BAD.test(t)){toast("Held for moderator review");$("#pt").value="";return}
    posts.unshift({id:Date.now(),cat:$("#pc").value,by:user.name,t,likes:0,rep:false,vet:null,ans:[]});notify("Your post is live","Community");community()};
}
// ---------- Shop
const PR=[
 {id:1,n:"Layers mash 50 kg",c:"Feed",p:3800,e:"🌾",s:"Mumias Feeds",rx:false},
 {id:2,n:"Dairy meal 70 kg",c:"Feed",p:3200,e:"🥛",s:"Mumias Feeds",rx:false},
 {id:3,n:"Dog food, adult 10 kg",c:"Pet food",p:4200,e:"🐕",s:"Pet Corner Kakamega",rx:false},
 {id:4,n:"Grooming brush set",c:"Grooming",p:900,e:"🪮",s:"Pet Corner Kakamega",rx:false},
 {id:5,n:"Milking bucket, steel",c:"Equipment",p:1700,e:"🪣",s:"Lurambi Agrovet",rx:false},
 {id:6,n:"Antibiotic injection (prescription)",c:"Veterinary medicine",p:1500,e:"💉",s:"Lurambi Vet Pharmacy",rx:true}
];
let cart={},rxOk=false,pay=null;
function shop(){
  const lines=Object.entries(cart).map(([id,q])=>({p:PR.find(x=>x.id==id),q})),tot=lines.reduce((n,l)=>n+l.p.p*l.q,0),needRx=lines.some(l=>l.p.rx);
  $("#view").innerHTML=`<div class="grid"><div class="products">${PR.map(p=>`<div class="prod"><span class="em">${p.e}</span><b>${p.n}</b><span class="mute">${p.s}. Delivery in Kakamega</span><div class="row"><b>${kes(p.p)}</b>${p.rx?'<span class="pill a">Prescription needed</span>':'<span class="pill">In stock</span>'}</div><button class="btn" data-p="${p.id}">Add to basket</button></div>`).join("")}</div>
  <div class="panel"><h3>Basket</h3>${lines.length?lines.map(l=>`<div class="cart-line"><span>${l.p.n} × ${l.q}</span><span>${kes(l.p.p*l.q)} <button class="btn alt" data-x="${l.p.id}" aria-label="Remove ${l.p.n}" style="padding:2px 8px">✕</button></span></div>`).join("")+`<div class="cart-line"><b>Total</b><b>${kes(tot)}</b></div>`:'<p class="mute">Your basket is empty.</p>'}
  ${needRx?`<div class="warn" style="border-color:var(--amber);background:var(--amberbg)"><b>Prescription medicine</b>Kenyan law requires a veterinary prescription and a licensed seller. <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="rx" style="width:auto" ${rxOk?"checked":""}> I have a prescription uploaded from my vet</label></div>`:""}
  ${lines.length?`<label for="mp">M-Pesa phone number</label><input id="mp" inputmode="tel" placeholder="07XX XXX XXX" value="${user?.phone||""}"><button class="btn" id="pay" style="width:100%;margin-top:10px">Pay ${kes(tot)} with M-Pesa</button><p class="note">You will get a prompt on your phone to enter your M-Pesa PIN. Cards and other providers plug in later.</p>`:""}
  ${pay?`<div class="vetans" style="margin-top:10px"><b>${pay}</b></div>`:""}</div></div>`;
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{cart[b.dataset.p]=(cart[b.dataset.p]||0)+1;pay=null;shop()});
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{delete cart[b.dataset.x];shop()});
  const rx=$("#rx");if(rx)rx.onchange=()=>rxOk=rx.checked;
  const pb=$("#pay");if(pb)pb.onclick=()=>{
    if(!need())return;
    if(needRx&&!$("#rx").checked){toast("Upload a prescription to buy this item");return}
    if(!/^(\+?254|0)[17]\d{8}$/.test($("#mp").value.replace(/\s/g,""))){toast("Enter a valid Kenyan phone number");return}
    pb.disabled=true;pay="Waiting for you to enter your M-Pesa PIN…";shop();
    setTimeout(()=>{pay="Payment received. Order confirmed.";cart={};rxOk=false;notify("Order confirmed: "+kes(tot),"Payment");shop()},2200)};
}
// ---------- Alerts
let notes=[
 {t:"Max's rabies vaccination is due in 19 days",k:"Vaccination",w:"Today"},
 {t:"Dr. Amina Wekesa responded to your request",k:"Vet response",w:"Today"},
 {t:"Layers flock A: 3 deaths in 7 days. Consider calling a vet",k:"Farm alert",w:"Yesterday"}
];
let pref={Email:true,SMS:true,Push:true,"In-app":true};
const notify=(t,k)=>{notes.unshift({t,k,w:"Just now"});$("#nb").textContent=notes.length}
function nt(){
  $("#view").innerHTML=`<div class="grid"><div class="panel"><h3>Recent alerts</h3>${notes.map(n=>`<div class="n"><span class="pill">${n.k}</span><span style="flex:1">${n.t}</span><span class="mute">${n.w}</span></div>`).join("")}</div>
  <div class="panel"><h3>How should we reach you?</h3>${Object.keys(pref).map(k=>`<div class="sw"><label style="margin:0" for="pf${k}">${k}</label><input type="checkbox" id="pf${k}" data-k="${k}" ${pref[k]?"checked":""}></div>`).join("")}
  <p class="note">Appointment reminders, vaccination and medication dates, vet replies and messages use the channels you turn on. Emergency alerts always show in the app.</p></div></div>`;
  document.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{pref[c.dataset.k]=c.checked;if(!c.checked&&!Object.values(pref).some(Boolean)){pref["In-app"]=true;toast("In-app alerts stay on");nt()}});
}
// ---------- Account
let otp=null;
function acc(){
  if(user){$("#view").innerHTML=`<div class="panel" style="max-width:480px"><h3>${user.name}</h3><p class="mute">Signed in as ${user.role}. ${user.via}</p><div class="sw"><span>Role</span><b>${user.role}</b></div><div class="sw"><span>Two-step verification</span><span class="pill a">Coming soon</span></div><button class="btn alt" id="out" style="margin-top:12px">Sign out</button></div>`;
    $("#out").onclick=()=>{user=null;head();acc()};return}
  $("#view").innerHTML=`<div class="panel" style="max-width:480px"><h3>Sign in or create an account</h3>
  <label for="rl">I am a</label><select id="rl"><option>Animal owner</option><option>Veterinarian</option><option>Clinic or pharmacy</option><option>Shelter or organisation</option></select>
  <label for="nm">Name</label><input id="nm" autocomplete="name">
  <label for="ph">Phone number</label><input id="ph" inputmode="tel" placeholder="07XX XXX XXX" autocomplete="tel">
  <button class="btn" id="sc" style="width:100%;margin-top:10px">Send code by SMS</button>
  <div id="ot" hidden><label for="cd">6-digit code</label><input id="cd" inputmode="numeric" maxlength="6"><button class="btn" id="vf" style="width:100%;margin-top:10px">Verify and continue</button></div>
  <div class="row" style="margin-top:14px"><button class="btn alt" id="gg" style="flex:1">Continue with Google</button><button class="btn alt" id="em" style="flex:1">Use email</button></div>
  <p class="note">Veterinarians get the Verified badge only after their registration and licence are checked. Google and email sign-in need the backend.</p></div>`;
  $("#sc").onclick=()=>{const p=$("#ph").value.replace(/\s/g,"");if(!$("#nm").value.trim()||!/^(\+?254|0)[17]\d{8}$/.test(p)){toast("Enter your name and a Kenyan phone number");return}
    otp=String(Math.floor(100000+Math.random()*900000));$("#ot").hidden=false;toast("Demo code: "+otp)};
  $("#vf").onclick=()=>{if($("#cd").value!==otp){toast("That code is not right. Check it and try again.");return}
    user={name:$("#nm").value.trim(),phone:$("#ph").value,role:$("#rl").value,via:"Phone and one-time code."};head();toast("Welcome, "+user.name);acc()};
  $("#gg").onclick=$("#em").onclick=()=>toast("Needs the backend. Use phone for this demo.");
}
const head=()=>$("#who").innerHTML=user?`<span class="pill">${user.name}, ${user.role}</span>`:`<button class="btn" id="si">Sign in</button>`;
function need(){if(user)return true;toast("Sign in first");go("acc");return false}
const V={com:community,shop,nt,acc};
function go(t){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));V[t]()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.t));
document.addEventListener("click",e=>{if(e.target.id==="si")go("acc")});
head();$("#nb").textContent=notes.length;community();
</script>
</body>
</html>
